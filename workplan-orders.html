<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<title>计划工单 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/workplan.css?v=20261112e">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
</head>
<body class="wo-page">

<div class="app">
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user"><span class="avatar">管</span><span class="name">系统管理员</span></div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">项目管理</div>
                <a class="app-side__item" href="project.html">项目信息</a>
                <a class="app-side__item is-active" href="workplan.html">计划管理</a>
                <a class="app-side__item" href="workplan-task.html">我的任务</a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="项目管理/计划工单">
                <h2 class="page-head__title">计划工单</h2>
            </div>

            <section class="el-card search-card wo-search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="woProject">关联项目</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="woProject"><option value="">全部项目</option></select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="woPlan">工作计划</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="woPlan"><option value="">全部计划</option></select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label">工单状态</label>
                            <div class="el-form-item__content">
                                <div class="wp-multi" id="woStatusMulti" data-placeholder="全部状态">
                                    <button type="button" class="el-input__inner wp-multi__btn" aria-haspopup="listbox">全部状态</button>
                                    <div class="wp-multi__panel" hidden>
                                        <label class="wp-multi__opt"><input type="checkbox" value="待处理">待处理</label>
                                        <label class="wp-multi__opt"><input type="checkbox" value="处理中">处理中</label>
                                        <label class="wp-multi__opt"><input type="checkbox" value="已完成">已完成</label>
                                        <div class="wp-multi__foot"><button type="button" class="wp-multi__clear">清空</button></div>
                                    </div>
                                    <input type="hidden" id="woStatus" value="">
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label">执行状态</label>
                            <div class="el-form-item__content">
                                <div class="wp-multi" id="woExecMulti" data-placeholder="全部状态">
                                    <button type="button" class="el-input__inner wp-multi__btn" aria-haspopup="listbox">全部状态</button>
                                    <div class="wp-multi__panel" hidden>
                                        <label class="wp-multi__opt"><input type="checkbox" value="未开始">未开始</label>
                                        <label class="wp-multi__opt"><input type="checkbox" value="进行中">进行中</label>
                                        <label class="wp-multi__opt"><input type="checkbox" value="已完成">已完成</label>
                                        <label class="wp-multi__opt"><input type="checkbox" value="已延期">已延期</label>
                                        <label class="wp-multi__opt"><input type="checkbox" value="已取消">已取消</label>
                                        <div class="wp-multi__foot"><button type="button" class="wp-multi__clear">清空</button></div>
                                    </div>
                                    <input type="hidden" id="woExec" value="">
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="woOwner">责任人</label>
                            <div class="el-form-item__content">
                                <div class="el-input"><input class="el-input__inner" type="text" id="woOwner" placeholder="姓名关键字"></div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="woKeyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input"><input class="el-input__inner" type="text" id="woKeyword" placeholder="工单号 / 任务 / 计划"></div>
                            </div>
                        </div>
                        <div class="el-form-item">
                            <button type="button" class="el-button el-button--primary" id="woSearch">查询</button>
                            <button type="button" class="el-button" id="woReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="el-card table-card">
                <div class="el-card__body">
                    <div class="wp-toolbar wp-toolbar--icons" role="toolbar" aria-label="计划工单操作">
                        <button type="button" class="el-button el-button--icon" id="woBtnExport"
                                title="导出 Excel（当前筛选全部行）" aria-label="导出 Excel">
                            <svg class="svg-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h5.2a6 6 0 01-.7-2H6V4h7v4h4v3.2c.7.1 1.4.3 2 .7V8l-5-6z"/><path fill="#67c23a" d="M8 11h3.2v1.8H8V11zm0 3.2h3.2v1.8H8v-1.8zm4.4-3.2H17v1.8h-4.6V11zm0 3.2H17v1.8h-4.6v-1.8z"/><path fill="currentColor" d="M17.2 13.5h1.8v4.1l1.7-1.7 1.3 1.3-3.9 3.9-3.9-3.9 1.3-1.3 1.7 1.7v-4.1z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="woBtnPrint"
                                title="打印 / 导出" aria-label="打印或导出">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v4H7V3zM5 8h14a2 2 0 012 2v6h-4v4H7v-4H3v-6a2 2 0 012-2zm4 10h6v2H9v-2z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="woBtnBack"
                                title="返回计划管理" aria-label="返回计划管理">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5L4 12l7 7v-5h9v-4h-9V5z"/></svg>
                        </button>
                        <span class="wp-hint">共 <b id="woCount">0</b> 张工单</span>
                    </div>

                    <div class="wo-summary" id="woSummary"></div>

                    <div class="table-wrapper" id="woTableWrapper">
                        <table class="el-table" id="woTable">
                            <thead><tr>
                                <th class="is-center" style="width:60px">序号</th>
                                <th>项目</th><th>计划编号</th><th>计划名称</th>
                                <th>工单号</th><th>任务名称</th>
                                <th class="is-center">责任人</th><th class="is-center">参与人员</th>
                                <th class="is-center">工单状态</th><th class="is-center">执行状态</th>
                                <th class="is-center">计划起止</th><th class="is-center">派发时间</th>
                                <th class="is-center">执行记录</th><th class="is-center">变更历史</th>
                            </tr></thead>
                            <tbody id="woTbody" class="el-table__body"></tbody>
                        </table>
                    </div>
                    <div id="woPager" class="pager-wrap"></div>
                </div>
            </section>
        </main>
    </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
<script src="js/btnperm.js?v=20261112a"></script>
<script src="js/word-import.js?v=20261106c"></script>
<script src="js/file-preview.js?v=20261110e"></script>
<script src="js/workplan-orders.js?v=20261111i"></script>
<div id="woPrintArea" class="wo-print-only"></div>
</body>
</html>
