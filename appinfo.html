<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>应用信息 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<link rel="stylesheet" href="css/appschema.css?v=20261120a">
<link rel="stylesheet" href="css/appinfo.css?v=20261117c">
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单 ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">数据中心</div>
                <a class="app-side__item" href="dbinfo.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zm8 6.5v3c0 1.7-3.6 3-8 3s-8-1.3-8-3v-3c1.7 1.3 4.7 2 8 2s6.3-.7 8-2zm0 6v3c0 1.7-3.6 3-8 3s-8-1.3-8-3v-3c1.7 1.3 4.7 2 8 2s6.3-.7 8-2z"/></svg></span>数据库
                </a>
                <a class="app-side__item is-active" href="appinfo.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1zm2 3v3h5V7H6zm7 0v3h5V7h-5zM6 12v2h12v-2H6zm0 4v2h8v-2H6z"/></svg></span>应用信息
                </a>
                <a class="app-side__item" href="appschema.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7v6H3V5zm11 0h7v6h-7V5zM3 14h7v5H3v-5zm11 0h7v5h-7v-5z"/></svg></span>应用结构
                </a>
                <div class="app-side__group-title">报表中心</div>
                <a class="app-side__item" href="report-designer.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 3h16a1 1 0 011 1v16a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1zm2 3v3h5V6H6zm7 0v3h5V6h-5zM6 11v3h5v-3H6zm7 0v3h5v-3h-5zM6 16v2h12v-2H6z"/></svg></span>报表设计
                </a>
                <a class="app-side__item" href="report-center.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg></span>报表中心
                </a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="数据中心/应用信息">
                <h2 class="page-head__title">应用信息</h2>
            </div>

            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="appSearchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--app-kw">
                            <label class="el-form-item__label" for="appKeyword">关键字</label>
                            <div class="el-form-item__content"><div class="el-input">
                                <input class="el-input__inner" type="text" id="appKeyword" placeholder="应用编码 / 名称 / 简称 / 描述">
                            </div></div>
                        </div>
                        <div class="el-form-item search-item--app-type">
                            <label class="el-form-item__label" for="appType">应用类型</label>
                            <div class="el-form-item__content">
                                <div class="ai-multi" id="appTypeMulti" data-placeholder="全部" data-select="appType">
                                    <input type="hidden" id="appType" value="">
                                    <button type="button" class="el-input__inner ai-multi__box" aria-haspopup="listbox" aria-expanded="false">
                                        <span class="ai-multi__text">全部</span>
                                        <span class="ai-multi__caret">▾</span>
                                    </button>
                                    <div class="ai-multi__drop" hidden>
                                        <div class="ai-multi__list" role="listbox" aria-multiselectable="true"></div>
                                        <div class="ai-multi__foot">
                                            <span class="ai-multi__count"></span>
                                            <button type="button" class="ai-multi__clear">清空</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--app-db">
                            <label class="el-form-item__label" for="appDbType">数据库类型</label>
                            <div class="el-form-item__content">
                                <div class="ai-multi" id="appDbTypeMulti" data-placeholder="全部" data-select="appDbType">
                                    <input type="hidden" id="appDbType" value="">
                                    <button type="button" class="el-input__inner ai-multi__box" aria-haspopup="listbox" aria-expanded="false">
                                        <span class="ai-multi__text">全部</span>
                                        <span class="ai-multi__caret">▾</span>
                                    </button>
                                    <div class="ai-multi__drop" hidden>
                                        <div class="ai-multi__list" role="listbox" aria-multiselectable="true"></div>
                                        <div class="ai-multi__foot">
                                            <span class="ai-multi__count"></span>
                                            <button type="button" class="ai-multi__clear">清空</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--app-status">
                            <label class="el-form-item__label" for="appStatus">状态</label>
                            <div class="el-form-item__content"><div class="el-input search-input--select">
                                <select class="el-input__inner" id="appStatus">
                                    <option value="">全部</option>
                                    <option value="1">启用</option>
                                    <option value="0">停用</option>
                                </select>
                            </div></div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="appBtnSearch">查询</button>
                            <button type="button" class="el-button" id="appBtnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="el-card table-card">
                <div class="el-card__body">
                    <div class="toolbar toolbar--icons" role="toolbar" aria-label="应用信息操作">
                        <button type="button" class="el-button el-button--primary el-button--icon" id="appBtnAdd"
                                title="新增应用" aria-label="新增应用">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="appBtnEdit" disabled
                                title="编辑应用（先选中一行）" aria-label="编辑应用">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.2V21h3.8L18 9.8 14.2 6 3 17.2zM20.7 7.1a1 1 0 000-1.4l-2.4-2.4a1 1 0 00-1.4 0l-1.8 1.8L18.9 9l1.8-1.9z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="appBtnSchema" disabled
                                title="打开应用结构（库表 / 字段 / 版本 / 对比）" aria-label="应用结构">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7v6H3V5zm11 0h7v6h-7V5zM3 14h7v5H3v-5zm11 0h7v5h-7v-5z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="appBtnEnable" disabled
                                title="启用选中的应用" aria-label="启用应用">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.2 14.6l-4.3-4.3 1.4-1.4 2.9 2.9 5.9-5.9 1.4 1.4-7.3 7.3z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="appBtnDisable" disabled
                                title="停用选中的应用" aria-label="停用应用">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2a8 8 0 015.3 2L6 17.3A8 8 0 0112 4zm0 16a8 8 0 01-5.3-2L18 6.7A8 8 0 0112 20z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="appBtnDelete" disabled
                                title="删除选中的应用（连带结构 / 版本 / 脚本）" aria-label="删除应用">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2zM4 6h16v2H4V6z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="appBtnRefresh"
                                title="刷新应用列表" aria-label="刷新">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
                        </button>
                        <span class="toolbar-hint">共 <b id="appCount">0</b> 个应用</span>
                    </div>
                    <div class="table-wrapper" id="appTableWrap">
                        <div class="el-table">
                            <div class="el-table__inner-wrapper">
                                <table id="appTable">
                                    <thead><tr>
                                        <th class="is-center" style="width:56px">序号</th>
                                        <th class="is-center" style="width:52px">选择</th>
                                        <th style="width:100px">应用编码</th>
                                        <th>应用名称</th>
                                        <th style="width:96px">应用类型</th>
                                        <th style="width:104px">数据库类型</th>
                                        <th class="is-center" style="width:70px">环境</th>
                                        <th style="width:150px">绑定连接</th>
                                        <th class="is-center" style="width:104px">库 / 对象</th>
                                        <th style="width:136px">最近扫描</th>
                                        <th class="is-center" style="width:76px">状态</th>
                                        <th class="is-center" style="width:78px">结构</th>
                                    </tr></thead>
                                    <tbody id="appTbody" class="el-table__body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div id="appPager" class="pager-wrap"></div>
                </div>
            </section>
        </main>
    </div>
</div>

<!-- ============ 新增 / 编辑应用弹窗模板 ============ -->
<div id="appFormTpl" style="display:none;">
    <form class="el-form app-form" id="appForm" autocomplete="off" onsubmit="return false;">
        <div class="app-form-grid">
            <div class="el-form-item is-required" data-field="code">
                <label class="el-form-item__label" for="afCode">应用编码</label>
                <div class="el-form-item__content">
                    <div class="el-input app-form-code">
                        <input class="el-input__inner" type="text" id="afCode" maxlength="40" placeholder="APP0001" readonly>
                        <button type="button" class="el-button el-button--small app-form-code__btn" id="afCodeNew"
                                title="重新取号">取号</button>
                    </div>
                    <div class="form-tip">APP + 4 位流水号，保存后不可修改</div>
                </div>
            </div>
            <div class="el-form-item is-required" data-field="name">
                <label class="el-form-item__label" for="afName">应用名称</label>
                <div class="el-form-item__content">
                    <div class="el-input"><input class="el-input__inner" type="text" id="afName" maxlength="100" placeholder="如：九豆综合管理平台"></div>
                </div>
            </div>
            <div class="el-form-item" data-field="shortName">
                <label class="el-form-item__label" for="afShort">简称</label>
                <div class="el-form-item__content">
                    <div class="el-input"><input class="el-input__inner" type="text" id="afShort" maxlength="60" placeholder="选填，如 menu-admin"></div>
                </div>
            </div>
            <div class="el-form-item is-required" data-field="appType">
                <label class="el-form-item__label" for="afType">应用类型</label>
                <div class="el-form-item__content">
                    <div class="el-input"><select class="el-input__inner" id="afType"></select></div>
                </div>
            </div>
            <div class="el-form-item is-required" data-field="dbType">
                <label class="el-form-item__label" for="afDbType">数据库类型</label>
                <div class="el-form-item__content">
                    <div class="el-input"><select class="el-input__inner" id="afDbType"></select></div>
                    <div class="form-tip">决定生成脚本的方言（建表 / 改表 / 删除 / 视图都按它渲染）</div>
                </div>
            </div>
            <div class="el-form-item" data-field="env">
                <label class="el-form-item__label" for="afEnv">运行环境</label>
                <div class="el-form-item__content">
                    <div class="el-input"><select class="el-input__inner" id="afEnv"></select></div>
                </div>
            </div>
            <div class="el-form-item" data-field="dbConnId">
                <label class="el-form-item__label" for="afConn">数据库连接</label>
                <div class="el-form-item__content">
                    <div class="el-input"><select class="el-input__inner" id="afConn"><option value="">不绑定（纯手工维护）</option></select></div>
                    <div class="form-tip">一个连接只能挂一个应用；留空表示不扫描，只按手工录入维护结构</div>
                </div>
            </div>
            <div class="el-form-item" data-field="ownerEmpId">
                <label class="el-form-item__label" for="afOwner">负责人</label>
                <div class="el-form-item__content">
                    <div class="el-input"><select class="el-input__inner" id="afOwner"><option value="">未指定</option></select></div>
                </div>
            </div>
            <div class="el-form-item" data-field="status">
                <label class="el-form-item__label" for="afStatus">状态</label>
                <div class="el-form-item__content">
                    <div class="el-input">
                        <select class="el-input__inner" id="afStatus">
                            <option value="1">启用</option>
                            <option value="0">停用</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="el-form-item" data-field="ispub">
                <label class="el-form-item__label" for="afIspub">公用否</label>
                <div class="el-form-item__content">
                    <div class="el-input">
                        <select class="el-input__inner" id="afIspub">
                            <option value="1">公用（所有用户可见）</option>
                            <option value="0">私有（仅创建人可见）</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="el-form-item" data-field="description">
            <label class="el-form-item__label" for="afDesc">描述</label>
            <div class="el-form-item__content">
                <div class="el-input"><textarea class="el-input__inner app-form-desc" id="afDesc" maxlength="500"
                    placeholder="应用用途 / 归属系统 / 联系人等，选填"></textarea></div>
            </div>
        </div>
    </form>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
<script src="js/btnperm.js?v=20261112a"></script>
<script src="js/appinfo.js?v=20261117e"></script>
</body>
</html>
