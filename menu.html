        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="首页/系统管理/菜单项管理">
                <h2 class="page-head__title">菜单项管理</h2>
            </div>

            <!-- 1.1 检索区域 -->
            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="keyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input el-input--prefix">
                                    <span class="el-input__prefix">
                                        <svg class="svg-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><g stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></svg>
                                    </span>
                                    <input class="el-input__inner" type="text" id="keyword" name="keyword" placeholder="请输入编号 / 中文名 / 英文名">
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--status">
                            <label class="el-form-item__label" for="enabled">启用状态</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="enabled" name="enabled">
                                        <option value="">全部</option>
                                        <option value="1">已启用</option>
                                        <option value="0">已停用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="btnSearch">查询</button>
                            <button type="button" class="el-button" id="btnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 1.2 操作引导区域 -->
            <section class="el-card">
                <div class="el-card__body">
                    <div class="toolbar">
                        <button type="button" class="el-button el-button--primary" id="btnAdd">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>新增
                        </button>
                        <button type="button" class="el-button el-button--success" id="btnEdit">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 19h2.4l9.3-9.3-2.4-2.4L5 16.6V19zM3 21v-4.2L15.9 3.9l4.2 4.2L7.2 21H3z"/></svg>编辑
                        </button>
                        <button type="button" class="el-button el-button--danger" id="btnDelete">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 7h12l-1 13H7L6 7zm3-4h6l1 2h4v2H4V5h4l1-2z"/></svg>删除
                        </button>
                        <span class="toolbar-hint">当前选中：<b id="selTip" style="color:#409eff">未选择任何菜单项</b></span>
                    </div>
                </div>
            </section>

            <!-- 1.3 查询结果列表区域 -->
            <section class="el-card table-card">
                <div class="table-wrapper" id="tableWrapper">
                    <div class="el-table">
                        <div class="el-table__inner-wrapper">
                            <table id="menuTable">
                                <colgroup>
                                    <col style="width:64px">
                                    <col style="width:56px">
                                    <col style="width:86px">
                                    <col style="width:96px">
                                    <col style="width:130px">
                                    <col style="width:130px">
                                    <col style="width:170px">
                                    <col style="width:170px">
                                    <col>
                                    <col style="width:90px">
                                    <col style="width:150px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th class="is-center">序号</th>
                                    <th class="is-center">选择</th>
                                    <th class="is-center">显示序号</th>
                                    <th>图标</th>
                                    <th>编号</th>
                                    <th>中文名</th>
                                    <th>英文名</th>
                                    <th>功能页面地址</th>
                                    <th>菜单功能说明</th>
                                    <th class="is-center">启用</th>
                                    <th>创建时间</th>
                                </tr>
                                </thead>
                                <tbody id="menuTbody" class="el-table__body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="pager-wrap" id="pagerWrap"></div>
            </section>
