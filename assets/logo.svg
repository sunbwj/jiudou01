<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="九豆">
  <defs>
    <linearGradient id="jdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="0.55" stop-color="#3f6bff"/>
      <stop offset="1" stop-color="#12d6c2"/>
    </linearGradient>
    <linearGradient id="jdSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#jdBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#jdSheen)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.5"/>

  <!-- 内描边 + 电路角饰（科技感） -->
  <path d="M12 50h8M44 14h8M12 14h6M46 50h6" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="50" cy="14" r="1.9" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="14" cy="50" r="1.9" fill="#ffffff" fill-opacity="0.9"/>

  <!-- “九豆”字标 -->
  <text x="32" y="43" text-anchor="middle" fill="#ffffff"
        font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Heiti SC',sans-serif"
        font-size="29" font-weight="700" letter-spacing="-1.5">九豆</text>
</svg>
