<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="科技感底纹">
  <defs>
    <linearGradient id="tileBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061423"/>
      <stop offset="0.5" stop-color="#071a2d"/>
      <stop offset="1" stop-color="#061423"/>
    </linearGradient>
    <linearGradient id="beamA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2f7bff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12d6c2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#12d6c2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#12d6c2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底色（纯色渐变，四角同色，保证平铺无明显接缝） -->
  <rect width="400" height="400" fill="url(#tileBase)"/>

  <!-- 网格线：0 / 50 … 400 对齐，平铺无缝 -->
  <g stroke="#1b4a72" stroke-opacity="0.5" stroke-width="1">
    <path d="M50 0V400M100 0V400M150 0V400M200 0V400M250 0V400M300 0V400M350 0V400"/>
    <path d="M0 50H400M0 100H400M0 150H400M0 200H400M0 250H400M0 300H400M0 350H400"/>
  </g>
  <!-- 主网格（每 200px 一条亮线，交界处仍对齐） -->
  <g stroke="#2f7bff" stroke-opacity="0.28" stroke-width="1">
    <path d="M0 0V400M200 0V400M0 0H400M0 200H400"/>
  </g>

  <!-- 对角光束 -->
  <g fill="none" stroke-width="22" stroke-linecap="butt" stroke-opacity="0.16">
    <path d="M20 400 L400 20" stroke="#2f7bff"/>
    <path d="M0 300 L300 0" stroke="#12d6c2"/>
    <path d="M100 400 L400 100" stroke="#7a5cff"/>
  </g>

  <!-- 电路节点与连线（整体位于 tile 内，重复后形成节奏感） -->
  <g fill="none" stroke="#3d9bff" stroke-opacity="0.34" stroke-width="1.4">
    <path d="M60 60h48v26h44"/>
    <path d="M60 60v34h-24"/>
    <path d="M296 120h44v54h-26"/>
    <path d="M300 300h-56v32h-40"/>
    <path d="M112 300v44h60"/>
    <path d="M250 260v-40h40"/>
  </g>
  <g fill="#63c8ff" fill-opacity="0.75">
    <circle cx="152" cy="86" r="3"/>
    <circle cx="60" cy="60" r="3.6"/>
    <circle cx="340" cy="120" r="3"/>
    <circle cx="314" cy="174" r="2.6"/>
    <circle cx="204" cy="332" r="3"/>
    <circle cx="172" cy="300" r="2.6"/>
    <circle cx="290" cy="220" r="3"/>
  </g>
  <g fill="#12d6c2" fill-opacity="0.55">
    <circle cx="200" cy="200" r="2.4"/>
    <circle cx="0" cy="200" r="2.4"/>
    <circle cx="200" cy="0" r="2.4"/>
    <circle cx="400" cy="200" r="2.4"/>
  </g>

  <!-- 六边形装饰（小尺寸、避开边缘） -->
  <g fill="none" stroke="#7a5cff" stroke-opacity="0.3" stroke-width="1.4">
    <path d="M330 250l16-9 16 9v18l-16 9-16-9z"/>
    <path d="M76 190l13-7.5 13 7.5v15l-13 7.5-13-7.5z" stroke-opacity="0.22"/>
  </g>
</svg>
