<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>系统首页 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
</head>
<body class="home-page">

<!-- 浅色科技底纹由 .home-page 的 background-image 平铺整页；这一层是跟随主题的柔光 -->
<div class="home-glow"></div>

<div class="home-wrap" id="pageHead" data-crumb="系统首页">
    <!-- 主标题：去掉说明文案，标题与英文名整体水平居中 + 垂直居中 -->
    <div class="home-hero">
        <h1 class="home-title" id="homeSysName">九豆综合管理平台</h1>
        <p class="home-sub" id="homeSysNameEn">Jiudou Integrated Management Platform</p>
    </div>

    <div class="home-divider"></div>

    <!-- 功能入口：按当前登录用户的菜单权限动态渲染（js/home.js）。
         每个顶级菜单组一页，组内是该组绑定的全部菜单项卡片；组数超过一页时用左右箭头 / 圆点轮播切换 -->
    <div class="home-carousel" id="homeCarousel">
        <div class="home-carousel__viewport" id="homeViewport">
            <div class="home-carousel__track" id="homeTrack"><!-- js/home.js 渲染 --></div>
        </div>
        <div class="home-carousel__foot" id="homeFoot" hidden>
            <button type="button" class="home-carousel__btn" id="homePrev" title="上一组" aria-label="上一组">&lsaquo;</button>
            <div class="home-carousel__dots" id="homeDots"></div>
            <button type="button" class="home-carousel__btn" id="homeNext" title="下一组" aria-label="下一组">&rsaquo;</button>
        </div>
    </div>

</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/home.js?v=20261112a"></script>
</body>
</html>
