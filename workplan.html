<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>计划管理 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/workplan.css?v=20261112e">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单（被框架页内嵌时由 layout.js 隐藏） ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">项目管理</div>
                <a class="app-side__item" href="project.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7l2 2h9v12H3V5zm2 2v10h14V9h-7.2L9.8 7H5z"/></svg></span>项目信息
                </a>
                <a class="app-side__item is-active" href="workplan.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 2v2h10V2h2v2h3v18H2V4h3V2h2zm13 8H4v10h16V10z"/></svg></span>计划管理
                </a>
                <a class="app-side__item" href="workplan-task.html">我的任务</a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="项目管理/计划管理">
                <h2 class="page-head__title">计划管理</h2>
            </div>

            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="wpProject">关联项目</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="wpProject"><option value="">全部项目</option></select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="wpKeyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input"><input class="el-input__inner" type="text" id="wpKeyword" placeholder="计划编号 / 名称 / 说明"></div>
                            </div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="wpBtnSearch">查询</button>
                            <button type="button" class="el-button" id="wpBtnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="el-card">
                <div class="el-card__body">
                    <!-- 标准 .toolbar：纳入 pageopbtn 扫描 + btnperm.js 按角色授权加载；
                         .wp-toolbar / --icons 保留图标栏视觉 -->
                    <div class="toolbar toolbar--icons wp-toolbar wp-toolbar--icons" role="toolbar" aria-label="工作计划操作">
                        <button type="button" class="el-button el-button--success el-button--icon" id="wpBtnAdd"
                                title="新建工作计划" aria-label="新建工作计划">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--primary el-button--icon" id="wpBtnOpen" disabled
                                title="工作计划（维护任务）" aria-label="工作计划">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 19h2.4l9.3-9.3-2.4-2.4L5 16.6V19zM3 21v-4.2L15.9 3.9l4.2 4.2L7.2 21H3z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--warning el-button--icon" id="wpBtnStart" disabled
                                title="启动计划（派发工单并通知责任人与参与人员）" aria-label="启动计划">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7L8 5z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="wpBtnStop" disabled
                                title="停止计划（仅创建人，仅已启动）" aria-label="停止计划">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v10H7z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="wpBtnOrders" disabled
                                title="查看该计划全部工单（按项目汇总）" aria-label="关联工单">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v4H4V4zm0 6h16v4H4v-4zm0 6h10v4H4v-4z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="wpBtnMyTask"
                                title="我的任务" aria-label="我的任务">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h13v2H3V5zm0 6h13v2H3v-2zm0 6h9v2H3v-2zm16.2-3.2l1.4 1.4L16 20l-3-3 1.4-1.4L16 17.2l3.2-3.4z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--danger el-button--icon" id="wpBtnDelete" disabled
                                title="删除工作计划" aria-label="删除工作计划">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h10l1 2h3v2H3V6h3l1-2zm-1 6h12l-1 11H7L6 10z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="wpBtnRefresh"
                                title="刷新" aria-label="刷新">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
                        </button>
                        <span class="wp-hint">共 <b id="wpCount">0</b> 条工作计划</span>
                    </div>
                </div>
            </section>

            <section class="el-card table-card wp-list">
                <div class="table-wrapper" id="wpTableWrapper">
                    <div class="el-table">
                        <div class="el-table__inner-wrapper">
                            <table id="wpTable">
                                <colgroup>
                                    <col style="width:60px"><col style="width:48px"><col style="width:110px">
                                    <col><col style="width:150px"><col style="width:100px">
                                    <col style="width:100px"><col style="width:70px">
                                    <col style="width:120px"><col style="width:80px"><col style="width:80px">
                                </colgroup>
                                <thead><tr>
                                    <th class="is-center">序号</th><th class="is-center">选择</th>
                                    <th>计划编号</th><th>计划名称</th><th>关联项目</th>
                                    <th class="is-center">开始日期</th><th class="is-center">结束日期</th>
                                    <th class="is-center">任务数</th><th>平均完成度</th>
                                    <th class="is-center">状态</th><th>创建人</th>
                                </tr></thead>
                                <tbody id="wpTbody" class="el-table__body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="pager-wrap" id="wpPager"></div>
            </section>
        </main>
</div>

<!-- ============ 新建工作计划：Visio「甘特图选项」对话框 ============ -->
<script type="text/template" id="wpNewTpl">
<div class="wp-form" id="wpNewForm">
    <label for="wpNewName">计划名称</label>
    <input class="el-input__inner wp-span2" type="text" id="wpNewName" maxlength="150" placeholder="如：2027 年一季度研发工作计划">
    <label for="wpNewCode">计划编号</label>
    <input class="el-input__inner wp-span2" type="text" id="wpNewCode" readonly placeholder="保存后自动生成 WP + 6 位">
    <label for="wpNewProject">关联项目</label>
    <select class="el-input__inner wp-span2" id="wpNewProject"><option value="">不关联（通用工作计划）</option></select>
    <label for="wpNewStart">日期范围</label>
    <div class="wp-span2" style="display:flex;align-items:center;gap:6px">
        <input class="el-input__inner" type="date" id="wpNewStart" style="flex:1">
        <span>至</span><input class="el-input__inner" type="date" id="wpNewEnd" style="flex:1">
    </div>
    <label for="wpNewScale">时间刻度</label>
    <select class="el-input__inner" id="wpNewScale">
        <option value="day">日（次要单位：天）</option>
        <option value="week" selected>周（次要单位：周）</option>
        <option value="month">月（次要单位：月）</option>
    </select>
    <label for="wpNewPub">共享设置</label>
    <div style="display:flex;gap:14px;align-items:center">
        <label style="text-align:left"><input type="checkbox" id="wpNewPub" checked> 公用</label>
        <label style="text-align:left"><input type="checkbox" id="wpNewWeekend" checked> 周末为非工作日</label>
    </div>
    <label for="wpNewDesc">计划说明</label>
    <textarea class="el-input__inner wp-span2 wp-new-desc" id="wpNewDesc" rows="7" maxlength="2000" placeholder="计划目标 / 范围 / 约束"></textarea>
</div>
</script>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
<script src="js/btnperm.js?v=20261112a"></script>
<script src="js/workplan.js?v=20261110g"></script>
</body>
</html>
