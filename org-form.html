<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>新增部门 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单 ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">系统管理</div>
                <a class="app-side__item" href="menu.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg></span>菜单项管理
                </a>
                <a class="app-side__item" href="menu-group.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg></span>菜单组管理
                </a>
                <a class="app-side__item" href="menu-group-item.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 6h2v12H4V6zm4 0h10v2H8V6zm0 5h10v2H8v-2zm0 5h7v2H8v-2zm12-9h2v12h-2V7z"/></svg></span>菜单组项目管理
                </a>
                <a class="app-side__item is-active" href="org.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M9 4a3 3 0 100 6 3 3 0 000-6zm-6 15v-1a5 5 0 015-5h2a5 5 0 015 5v1H3zm12-15a3 3 0 110 6 3 3 0 010-6zm-2 15v-1a5 5 0 013-4.6V19h-3z"/></svg></span>组织架构
                </a>
                <a class="app-side__item" href="emp.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg></span>员工信息管理
                </a>
                <a class="app-side__item" href="role.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l7 3v5.5c0 4.2-2.9 7.4-7 8.9-4.1-1.5-7-4.7-7-8.9V6l7-3zm0 2.2L7 7.1v4.4c0 3.1 2 5.6 5 6.9 3-1.3 5-3.8 5-6.9V7.1l-5-1.9z"/></svg></span>用户角色管理
                </a>
                <a class="app-side__item" href="role-power.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l8 4v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6l8-4zm0 4.6L8 8.4V12c0 3.2 1.9 5.6 4 6.7 2.1-1.1 4-3.5 4-6.7V8.4l-4-1.8zm-1 3l3.2 2.4L11 14.4v-2.2L9.8 11 11 9.6z"/></svg></span>角色权限配置
                </a>
                <a class="app-side__item" href="page-op-btn.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v3H4V5zm0 5h9v3H4v-3zm0 5h9v3H4v-3zm12-4l4 2.5L16 16v-5z"/></svg></span>页面操作按钮管理
                </a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="组织架构/新增部门">
                <h2 class="page-head__title" id="pageTitle">新增部门</h2>
            </div>

            <section class="el-card form-page">
                <div class="el-card__body">
                    <form class="el-form form-label-width" id="orgForm" novalidate onsubmit="return false;">
                        <!-- 编号 -->
                        <div class="el-form-item is-required" data-field="code">
                            <label class="el-form-item__label" for="code">部门编号</label>
                            <div class="el-form-item__content field-line">
                                <div class="el-input"><input class="el-input__inner" type="text" id="code" name="code" maxlength="24" placeholder="例如：DPT0001"></div>
                                <span class="form-tip" id="codeTip">由系统自动生成（DPT + 4 位流水号），无需填写</span>
                            </div>
                        </div>

                        <!-- 部门名称 -->
                        <div class="el-form-item is-required" data-field="nameCn">
                            <label class="el-form-item__label" for="nameCn">部门名称</label>
                            <div class="el-form-item__content">
                                <div class="el-input"><input class="el-input__inner" type="text" id="nameCn" name="nameCn" maxlength="50" placeholder="例如：技术研发部"></div>
                            </div>
                        </div>

                        <!-- 上级部门 -->
                        <div class="el-form-item" data-field="parentId">
                            <label class="el-form-item__label" for="parentId">上级部门</label>
                            <div class="el-form-item__content field-line">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="parentId" name="parentId">
                                        <option value="0">（顶级部门，无上级）</option>
                                    </select>
                                </div>
                                <span class="form-tip" id="levelTip">层级由上级部门自动推导，最多 5 级</span>
                            </div>
                        </div>

                        <!-- 职能说明 -->
                        <div class="el-form-item" data-field="duty">
                            <label class="el-form-item__label" for="duty">职能说明</label>
                            <div class="el-form-item__content">
                                <div class="el-textarea"><textarea class="el-textarea__inner" id="duty" name="duty" rows="3" maxlength="500" placeholder="简要描述该部门的职责与分工"></textarea></div>
                            </div>
                        </div>

                        <!-- 排序号 -->
                        <div class="el-form-item" data-field="sortNo">
                            <label class="el-form-item__label" for="sortNo">排序号</label>
                            <div class="el-form-item__content field-line">
                                <div class="el-input el-input--small"><input class="el-input__inner" type="number" id="sortNo" name="sortNo" min="0" max="9999" step="1" value="0" style="width:120px"></div>
                                <span class="form-tip">同级部门按此数值升序排列（数值小的在前）</span>
                            </div>
                        </div>

                        <!-- 启用否 -->
                        <div class="el-form-item" data-field="enabled">
                            <label class="el-form-item__label">启用否</label>
                            <div class="el-form-item__content">
                                <span class="switch-line">
                                    <span class="el-switch is-checked" id="enabledSwitch" role="switch">
                                        <input class="el-switch__input" type="checkbox" id="enabled" checked>
                                        <span class="el-switch__core"></span>
                                    </span>
                                    <span class="switch-text" id="enabledText">已启用</span>
                                </span>
                                <!-- 有启用状态的下级部门时：开关锁定为「启用」，并在此说明原因 -->
                                <div class="switch-tip" id="enabledTip" style="display:none;"></div>
                            </div>
                        </div>

                        <!-- 操作（form-actions：页面操作按钮表 pageopbtn 扫描识别用） -->
                        <div class="el-form-item form-actions">
                            <div class="el-form-item__content">
                                <button type="button" class="el-button el-button--primary" id="btnSave">保存</button>
                                <button type="button" class="el-button" id="btnBack">返回</button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
    <script src="js/btnperm.js?v=20261112a"></script>
<script src="js/org-form.js?v=20261031g"></script>
</body>
</html>
