<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>项目文件 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
<style>
/* 操作引导区：图标按钮 + 右侧数量提示 */
.toolbar--icons .toolbar-hint { margin-left: auto; }
</style>
<style>
/* 文件类型复选下拉 */
.search-card { overflow: visible; }
.pf-multi { position: relative; width: 100%; }
.pf-multi__box { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 32px; padding: 0 9px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; color: #606266; font-size: 13px; text-align: left; cursor: pointer; }
.pf-multi__box:hover, .pf-multi__box:focus { border-color: #409eff; outline: none; }
.pf-multi__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pf-multi__caret { flex: 0 0 auto; margin-left: 6px; color: #c0c4cc; }
.pf-multi.has-value .pf-multi__text { color: #303133; }
.pf-multi__drop { position: absolute; left: 0; right: 0; top: 36px; z-index: 60; padding: 0; border: 1px solid #e4e7ed; border-radius: 4px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.pf-multi__list { max-height: 190px; overflow: auto; padding: 5px 4px; }
.pf-multi__opt { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 13px; color: #606266; cursor: pointer; }
.pf-multi__opt:hover { background: #f5f7fa; color: #409eff; }
.pf-multi__opt input { width: auto; flex: 0 0 auto; margin: 0; }
.pf-multi__foot { padding: 4px 8px 2px; border-top: 1px solid #f0f2f5; text-align: right; }
.pf-multi__clear { padding: 0; border: 0; background: none; color: #909399; font-size: 12px; cursor: pointer; }
.pf-multi__clear:hover { color: #f56c6c; }
</style>
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单（被框架页内嵌时由 layout.js 隐藏） ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">项目管理</div>
                <a class="app-side__item" href="project.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7l2 2h9v12H3V5zm2 2v10h14V9h-7.2L9.8 7H5z"/></svg></span>项目信息
                </a>
                <a class="app-side__item is-active" href="project-file.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h8l5 5v15H6V2zm7 1.5V8h4.5L13 3.5zM8 11h8v2H8v-2zm0 4h8v2H8v-2z"/></svg></span>项目文件
                </a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="项目管理/项目文件">
                <h2 class="page-head__title">项目文件</h2>
            </div>

            <!-- 说明 -->
			<!--
            <section class="el-card pj-tipcard">
                <div class="el-card__body">
                    <div class="pj-tip">
                        <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <span>
                            文件挂在具体项目下，上传后由系统保存到服务器静态目录，列表里只登记<b>文件名 / 路径 / 类型 / 大小 / 说明</b>。
                            检索结果只包含<b>本人上传</b>或<b>其他用户标为公用</b>的文件；所属项目下拉同样只列本人创建或公用的项目。
                            单个文件上限 10 MB，停用的文件不能下载。
                        </span>
                    </div>
                </div>
            </section>-->

            <!-- 检索区域 -->
            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="projectId">所属项目</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="projectId" name="projectId">
                                        <option value="">全部项目</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="keyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input el-input--prefix">
                                    <span class="el-input__prefix">
                                        <svg class="svg-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><g stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></svg>
                                    </span>
                                    <input class="el-input__inner" type="text" id="keyword" name="keyword" placeholder="文件名 / 说明 / 项目 / 上传人">
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--status">
                            <label class="el-form-item__label" for="fileType">文件类型</label>
                            <div class="el-form-item__content">
                                <div class="pf-multi" id="fileTypeMulti" data-placeholder="全部类型">
                                    <select id="fileType" name="fileType" style="display:none">
                                        <option value="">全部类型</option>
                                    </select>
                                    <button type="button" class="el-input__inner pf-multi__box" aria-haspopup="true">
                                        <span class="pf-multi__text">全部类型</span>
                                        <span class="pf-multi__caret">▾</span>
                                    </button>
                                    <div class="pf-multi__drop" hidden>
                                        <div class="pf-multi__list" id="fileTypeList"></div>
                                        <div class="pf-multi__foot">
                                            <button type="button" class="pf-multi__clear" id="fileTypeClear">清空</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--status">
                            <label class="el-form-item__label" for="ispub">公用否</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="ispub" name="ispub">
                                        <option value="">全部</option>
                                        <option value="1">公用</option>
                                        <option value="0">私有</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--status">
                            <label class="el-form-item__label" for="enabled">启用状态</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="enabled" name="enabled">
                                        <option value="">全部</option>
                                        <option value="1">启用</option>
                                        <option value="0">停用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="btnSearch">查询</button>
                            <button type="button" class="el-button" id="btnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 操作引导区域 -->
            <section class="el-card">
                <div class="el-card__body">
                    <div class="toolbar toolbar--icons" role="toolbar" aria-label="项目文件操作">
                        <button type="button" class="el-button el-button--success el-button--icon" id="btnAdd" title="上传文件" aria-label="上传文件"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg></button>
                        <button type="button" class="el-button el-button--primary el-button--icon" id="btnEdit" disabled title="编辑文件" aria-label="编辑文件"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 19h2.4l9.3-9.3-2.4-2.4L5 16.6V19zM3 21v-4.2L15.9 3.9l4.2 4.2L7.2 21H3z"/></svg></button>
                        <button type="button" class="el-button el-button--icon" id="btnDownload" disabled title="下载文件" aria-label="下载文件"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 3h2v9l3.5-3.5L18 10l-6 6-6-6 1.5-1.5L11 12V3zM4 18h16v2H4v-2z"/></svg></button>
                        <button type="button" class="el-button el-button--success el-button--icon" id="btnEnable" disabled title="启用文件" aria-label="启用文件"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 14.4l-4-4 1.4-1.4L11 13.6l4.6-4.6L17 10.4l-6 6z"/></svg></button>
                        <button type="button" class="el-button el-button--warning el-button--icon" id="btnDisable" disabled title="停用文件" aria-label="停用文件"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm5 11H7v-2h10v2z"/></svg></button>
                        <button type="button" class="el-button el-button--danger el-button--icon" id="btnDelete" disabled title="删除文件" aria-label="删除文件"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h10l1 2h3v2H3V6h3l1-2zm-1 6h12l-1 11H7L6 10z"/></svg></button>
                        <button type="button" class="el-button el-button--icon" id="btnRefresh" title="刷新文件列表" aria-label="刷新文件列表"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg></button>
                        <span class="toolbar-hint">共 <b id="pfCount">0</b> 个文件</span>
                    </div>
                </div>
            </section>

            <!-- 查询结果 -->
            <section class="el-card table-card">
                <div class="table-wrapper" id="tableWrapper">
                    <div class="el-table">
                        <div class="el-table__inner-wrapper">
                            <table id="pfTable">
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:48px">
                                    <col style="width:180px">
                                    <col style="width:220px">
                                    <col style="width:86px">
                                    <col style="width:96px">
                                    <col style="width:76px">
                                    <col style="width:96px">
                                    <col style="width:156px">
                                    <col style="width:80px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th class="is-center">序号</th>
                                    <th class="is-center">选择</th>
                                    <th>所属项目</th>
                                    <th>文件名</th>
                                    <th>文件类型</th>
                                    <th class="is-center">大小</th>
                                    <th class="is-center">公用否</th>
                                    <th>上传人</th>
                                    <th>上传时间</th>
                                    <th class="is-center">启用</th>
                                </tr>
                                </thead>
                                <tbody id="pfTbody" class="el-table__body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="pager-wrap" id="pagerWrap"></div>
            </section>
        </main>
    </div>
</div>

<!-- ============ 上传 / 编辑文件弹窗模板 ============ -->
<div id="projectFileFormTpl" style="display:none;">
    <form class="el-form pj-form" id="projectFileForm" autocomplete="off" onsubmit="return false;">
        <input type="hidden" id="pfData" value="">
        <div class="el-form-item is-required" data-field="projectId">
            <label class="el-form-item__label" for="pfProject">所属项目</label>
            <div class="el-form-item__content">
                <div class="el-input"><select class="el-input__inner" id="pfProject"></select></div>
                <div class="form-tip">下拉只列本人创建或其他用户标为公用、且启用的项目</div>
            </div>
        </div>
        <div class="el-form-item" data-field="dirId">
            <label class="el-form-item__label" for="pfDirId">所属目录</label>
            <div class="el-form-item__content">
                <div class="el-input"><select class="el-input__inner" id="pfDirId"></select></div>
                <div class="form-tip">先选所属项目再选目录；下拉按层级缩进显示，不选择时文件直接关联项目。切换项目会清空已选目录。</div>
            </div>
        </div>
        <div class="el-form-item is-required" data-field="file">
            <label class="el-form-item__label" for="pfFile">选择文件</label>
            <div class="el-form-item__content">
                <div class="el-input"><input class="el-input__inner pj-file" type="file" id="pfFile"></div>
                <div class="form-tip" id="pfFileTip">请选择要上传的文件（单个不超过 10 MB）；编辑时留空表示不替换文件</div>
            </div>
        </div>
        <div class="el-form-item is-required" data-field="fileName">
            <label class="el-form-item__label" for="pfName">文件名</label>
            <div class="el-form-item__content">
                <div class="el-input"><input class="el-input__inner" type="text" id="pfName" maxlength="255" placeholder="选择文件后自动带入，可修改"></div>
            </div>
        </div>
        <div class="el-form-item" data-field="fileType">
            <label class="el-form-item__label" for="pfType">文件类型</label>
            <div class="el-form-item__content">
                <div class="el-input"><select class="el-input__inner" id="pfType"></select></div>
            </div>
        </div>
        <div class="el-form-item" data-field="fileDesc">
            <label class="el-form-item__label" for="pfDesc">文件说明</label>
            <div class="el-form-item__content">
                <div class="el-input"><textarea class="el-input__inner pj-textarea" id="pfDesc" maxlength="500" rows="3" placeholder="选填"></textarea></div>
            </div>
        </div>
        <div class="el-form-item" data-field="ispub">
            <label class="el-form-item__label" for="pfIspub">公用否</label>
            <div class="el-form-item__content">
                <div class="el-input">
                    <select class="el-input__inner" id="pfIspub">
                        <option value="1">公用（其他用户可检索 / 下载）</option>
                        <option value="0">私有（仅上传人可检索 / 下载）</option>
                    </select>
                </div>
                <div class="form-tip">默认公用；上传人由系统按当前登录账号自动记录</div>
            </div>
        </div>
        <div class="el-form-item" data-field="enabled">
            <label class="el-form-item__label" for="pfEnabled">启用状态</label>
            <div class="el-form-item__content">
                <div class="el-input">
                    <select class="el-input__inner" id="pfEnabled">
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select>
                </div>
            </div>
        </div>
    </form>
</div>

<span id="pfLastDownload" data-url="" style="display:none"></span>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>

<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>

<script src="js/project-file.js?v=20261106d"></script>
</body>
