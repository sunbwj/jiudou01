<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>项目类型字典渲染探针（临时）</title></head>
<body data-probe="pending">
<script>
/* 同源父页先注入有效 SSO 会话，避免 iframe 子页 401 把顶层送去登录页 */
(function () {
  try {
    localStorage.setItem('menu_admin_login_v1', JSON.stringify({
      token: '__TOKEN__',
      time: new Date().toISOString().slice(0, 19).replace('T', ' '),
      expireAt: Date.now() + 8 * 3600 * 1000,
      ttlHours: 8,
      user: { ename: '字典探针', empId: 0, account: 'probe' }
    }));
  } catch (e) {
    document.body.setAttribute('data-probe', 'SESSION-ERROR ' + e.message);
  }
  var f = document.createElement('iframe');
  f.id = 'probeFrame';
  f.src = '/sysdict.html';
  f.style.cssText = 'width:1280px;height:900px;border:0';
  document.body.appendChild(f);
})();
</script>
<script>
var FRAME = document.getElementById('probeFrame');
function report(t) { document.body.setAttribute('data-probe', t); }

window.addEventListener('load', function () {
  setTimeout(function () {
    var doc, win;
    try {
      doc = FRAME.contentDocument;
      win = FRAME.contentWindow;
    } catch (e) {
      report('FRAME-ERROR ' + e.message);
      return;
    }
    var rows = doc.querySelectorAll('#sdTbody tr[data-id]');
    if (!rows.length) {
      report('OK-NODATA sdRows=0');
      return;
    }
    var target = null;
    for (var i = 0; i < rows.length; i++) {
      var cn = rows[i].querySelector('.sysdict-row__main b');
      if (cn && cn.textContent.replace(/\s+/g, '') === '项目类型') { target = rows[i]; break; }
    }
    if (!target) {
      var names = [];
      for (var j = 0; j < rows.length; j++) {
        var b = rows[j].querySelector('.sysdict-row__main b');
        names.push(b ? b.textContent.replace(/\s+/g, '') : '?');
      }
      report('NO-TARGET rows=' + rows.length + ' names=' + names.join('|'));
      return;
    }
    var sub = target.querySelector('.sysdict-row__sub');
    var line = 'sdRows=' + rows.length +
               ' count=' + (target.querySelector('.sysdict-row__count') || {}).textContent +
               ' sub=' + (sub ? sub.textContent.replace(/\s+/g, ' ') : '');

    target.dispatchEvent(new win.Event('click', { bubbles: true }));
    target.dispatchEvent(new win.Event('dblclick', { bubbles: true }));

    setTimeout(function () {
      var irows = doc.querySelectorAll('#siTbody tr[data-id]');
      var vals = [];
      for (var k = 0; k < irows.length; k++) {
        var td = irows[k].querySelectorAll('td');
        /* 列序：序号 / 选择 / 键 / 键值 / 显示序号 / 说明 / 启用 */
        vals.push(td.length > 3 ? td[3].textContent.replace(/\s+/g, '') : '?');
      }
      report('OK ' + line +
             ' curDict=' + doc.querySelector('#siCurrentDict').textContent.replace(/\s+/g, '') +
             ' siRows=' + irows.length +
             ' vals=' + vals.join(','));
    }, 1600);
  }, 3200);
});
</script>
</body>
</html>
