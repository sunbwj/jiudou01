<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>真实浏览器几何探针（临时）</title></head>
<body data-probe="pending">
<script>
/* 同源父页先注入真实有效的 SSO 会话，避免 iframe 子页 401 把顶层送去登录页 */
(function () {
  try {
    localStorage.setItem('menu_admin_login_v1', JSON.stringify({
      token: '__TOKEN__',
      time: new Date().toISOString().slice(0, 19).replace('T', ' '),
      expireAt: Date.now() + 8 * 3600 * 1000,
      ttlHours: 8,
      user: { ename: '几何探针', empId: 0, account: 'probe' }
    }));
  } catch (e) {
    document.body.setAttribute('data-probe', 'SESSION-ERROR ' + e.message);
  }
  var f = document.createElement('iframe');
  f.id = 'probeFrame';
  f.src = '/project-form.html?mode=add';
  f.style.cssText = 'width:1400px;height:900px;border:0';
  document.body.appendChild(f);
})();
</script>
<script>
function report(text) { document.body.setAttribute('data-probe', text); }
window.addEventListener('load', function () {
  setTimeout(function () {
    try {
      var frame = document.getElementById('probeFrame');
      var doc = frame.contentDocument, win = frame.contentWindow;
      var base = doc.querySelector('.pjf-base'), editor = doc.querySelector('.pjf-editor');
      if (!base || !editor) {
        report('MISSING base=' + !!base + ' editor=' + !!editor +
               ' url=' + win.location.href +
               ' text=' + (doc.body ? doc.body.innerText.slice(0, 80).replace(/\s+/g, ' ') : ''));
        return;
      }
      var bw = base.getBoundingClientRect().width;
      var ew = editor.getBoundingClientRect().width;
      var pct = Math.round(ew / (bw + ew) * 1000) / 10;
      var ed = doc.querySelector('#pjDescEditor');
      report('OK baseW=' + Math.round(bw) + ' editorW=' + Math.round(ew) +
             ' editorPct=' + pct +
             ' contenteditable=' + (ed ? ed.getAttribute('contenteditable') : 'none') +
             ' toolbarBtns=' + doc.querySelectorAll('#pjfToolbar .pjf-tool').length +
             ' wordImport=' + (typeof win.WordImport !== 'undefined') +
             ' richBox=' + !!doc.querySelector('.pjf-editor'));
    } catch (e) { report('ERROR ' + e.message); }
  }, 4000);
});
</script>
</body>
</html>
