<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>drag / dir-select probe</title>
<style>body{font-family:monospace;padding:8px}iframe{width:1400px;height:900px;border:1px solid #ccc}</style>
</head>
<body>
<pre id="out"></pre>
<iframe id="fr" src=""></iframe>
<script>
(function () {
    var q = new URLSearchParams(location.search);
    var tk = q.get('tk') || '';
    var pid = q.get('pid') || '';
    var out = document.getElementById('out');
    var errs = [];
    function log(s) { out.textContent += s + '\n'; }
    function attr(k, v) { document.documentElement.setAttribute(k, v); }

    try {
        localStorage.setItem('menu_admin_login_v1', JSON.stringify({
            token: tk, account: q.get('acc') || '13813970452', empId: 1,
            ename: q.get('ename') || '', expireAt: Date.now() + 6 * 3600 * 1000,
            time: new Date().toISOString(), ttlHours: 8
        }));
    } catch (e) { errs.push('localStorage: ' + e.message); }

    var fr = document.getElementById('fr');
    fr.src = '../project.html?probe=drag';

    fr.onload = function () {
        var w = fr.contentWindow, d = fr.contentDocument;
        w.onerror = function (m, u, l) { errs.push('iframe error: ' + m + ' @' + l); };

        var tries = 0;
        (function waitRows() {
            var rows = d.querySelectorAll('#pjTbody tr[data-id]');
            if (!rows.length && tries < 80) { tries++; return setTimeout(waitRows, 250); }
            attr('data-rows', String(rows.length));
            var target = null;
            for (var i = 0; i < rows.length; i++) {
                if (rows[i].getAttribute('data-id') === pid) { target = rows[i]; break; }
            }
            if (!target) { target = rows[0]; }
            if (!target) { attr('data-done', 'no-rows'); return; }
            target.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
            target.dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true }));

            setTimeout(function () {
                var tab = d.querySelector('#pfTabTree');
                attr('data-tab-text', tab ? tab.textContent.trim() : '');
                if (tab) { tab.click(); }
                setTimeout(runDrag, 1500);
            }, 2000);
        })();

        function runDrag() {
            var view = d.querySelector('#pfTreeView');
            attr('data-root-nodes', String(d.querySelectorAll('#pfTreeView .pj-tnode[data-kind=root]').length));
            attr('data-dir-count', String(d.querySelectorAll('#pfTreeView .pj-tnode--dir').length));
            attr('data-file-count', String(d.querySelectorAll('#pfTreeView .pj-tnode--file').length));

            var seq = [];
            var kids = view ? view.children : [];
            for (var k = 0; k < kids.length; k++) {
                var c = kids[k];
                if (c.classList.contains('pj-tree__rootdrop')) { seq.push('DROP'); continue; }
                var nm = c.querySelector('.pj-tnode__name');
                seq.push((c.classList.contains('pj-tnode--dir') ? 'D:' : 'F:') +
                    (nm ? nm.textContent.trim().slice(0, 12) : '?'));
            }
            attr('data-tree-seq', JSON.stringify(seq));

            var drop = d.querySelector('#pfTreeView .pj-tree__rootdrop');
            attr('data-rootdrop', drop ? 'yes' : 'no');
            attr('data-rootdrop-display', drop ? getComputedStyle(drop).display : 'none');

            var files = d.querySelectorAll('#pfTreeView .pj-tnode--file[draggable=true]');
            attr('data-draggable-files', String(files.length));
            var dirs = d.querySelectorAll('#pfTreeView .pj-tnode--dir');
            if (!files.length || !dirs.length) { attr('data-done', 'no-nodes'); return; }
            var file = files[0];
            attr('data-file-name', file.textContent.trim().slice(0, 40));

            // 拦截写接口：只验证拖拽管线与提交参数，不改真实数据
            var captured = null;
            w.Api.projectFile.update = function (payload) {
                captured = payload;
                var dfd = w.jQuery.Deferred();
                dfd.resolve({});
                return dfd.promise();
            };

            var dt;
            try { dt = new DataTransfer(); } catch (e) {
                try { dt = new w.DataTransfer(); } catch (e2) { dt = null; errs.push('DataTransfer: ' + e2.message); }
            }
            var firedStart = false, firedOver = false, firedDrop = false;
            var dropDir = null, dropDirId = '', tried = 0;
            try {
                for (var di = 0; di < dirs.length && !captured; di++) {
                    tried++;
                    dropDir = dirs[di];
                    dropDirId = dropDir.getAttribute('data-id') || '';
                    file.dispatchEvent(new w.DragEvent('dragstart', { bubbles: true, cancelable: true, dataTransfer: dt }));
                    firedStart = true;
                    attr('data-dragging-class', view.classList.contains('is-dragging') ? 'yes' : 'no');
                    attr('data-rootdrop-display-dragging', drop ? getComputedStyle(drop).display : 'none');
                    attr('data-dt-type', dt ? String(dt.getData('text/plain')) : 'no-dt');
                    dropDir.dispatchEvent(new w.DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dt }));
                    firedOver = true;
                    attr('data-over-class', dropDir.classList.contains('is-drop-target') ? 'yes' : 'no');
                    dropDir.dispatchEvent(new w.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
                    firedDrop = true;
                }
            } catch (e) { errs.push('dispatch: ' + e.message); }
            attr('data-dir-name', dropDir ? dropDir.textContent.trim().slice(0, 40) : '');
            attr('data-dir-id', dropDirId);
            attr('data-tried-dirs', String(tried));

            setTimeout(function () {
                var jq = w.jQuery;
                attr('data-fired', [firedStart, firedOver, firedDrop].join('/'));
                attr('data-drop-payload', captured ? JSON.stringify(captured) : 'none');
                attr('data-dir-id', dropDir ? (dropDir.getAttribute('data-id') || '') : '');
                attr('data-after-dragging', view.classList.contains('is-dragging') ? 'yes' : 'no');
                attr('data-after-drop-target', String(view.querySelectorAll('.is-drop-target').length));
                var msg = d.querySelector('.el-message__content') || d.querySelector('.el-message');
                attr('data-toast', msg ? msg.textContent.trim().slice(0, 80) : 'none');
                var filesAfter = d.querySelectorAll('#pfTreeView .pj-tnode--file[draggable=true]');
                var parentAfter = '';
                if (filesAfter[0]) {
                    var pv = filesAfter[0].previousElementSibling;
                    while (pv) {
                        if (pv.classList.contains('pj-tnode--dir')) { parentAfter = pv.querySelector('.pj-tnode__name').textContent; break; }
                        pv = pv.previousElementSibling;
                    }
                }
                attr('data-first-parent-after', parentAfter || '(根)');

                // ② 上传弹窗的所属目录下拉
                var btn = d.querySelector('#btnPfUpload');
                if (btn) { btn.click(); }
                setTimeout(function () {
                    var overlay = d.querySelector('.el-overlay .el-dialog');
                    var sel = (overlay && overlay.querySelector('#upDirId')) || d.querySelector('.el-overlay #upDirId');
                    attr('data-up-select', sel ? 'yes' : 'no');
                    attr('data-up-options', sel ? String(sel.options.length) : '0');
                    var texts = [];
                    if (sel) { for (var i = 0; i < sel.options.length; i++) { texts.push(sel.options[i].text); } }
                    attr('data-up-option-texts', JSON.stringify(texts));
                    attr('data-up-has-tree', d.querySelector('.el-overlay #upDirTree') ? 'yes' : 'no');
                    attr('data-overlay', overlay ? 'yes' : 'no');
                    attr('data-errors', errs.join(' || '));
                    attr('data-done', 'yes');
                    log('dirs=' + d.querySelectorAll('#pfTreeView .pj-tnode--dir').length +
                        ' files=' + d.querySelectorAll('#pfTreeView .pj-tnode--file').length +
                        ' up-options=' + (sel ? sel.options.length : 0));
                    log('errs=' + errs.join(' | '));
                }, 1200);
            }, 1200);
        }
    };
})();
</script>
</body>
</html>
