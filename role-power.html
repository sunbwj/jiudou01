<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>角色权限配置 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单 ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">系统管理</div>
                <a class="app-side__item" href="menu.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg></span>菜单项管理
                </a>
                <a class="app-side__item" href="menu-group.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg></span>菜单组管理
                </a>
                <a class="app-side__item" href="menu-group-item.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 6h2v12H4V6zm4 0h10v2H8V6zm0 5h10v2H8v-2zm0 5h7v2H8v-2zm12-9h2v12h-2V7z"/></svg></span>菜单组项目管理
                </a>
                <a class="app-side__item" href="org.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M9 4a3 3 0 100 6 3 3 0 000-6zm-6 15v-1a5 5 0 015-5h2a5 5 0 015 5v1H3zm12-15a3 3 0 110 6 3 3 0 010-6zm-2 15v-1a5 5 0 013-4.6V19h-3z"/></svg></span>组织架构
                </a>
                <a class="app-side__item" href="emp.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg></span>员工信息管理
                </a>
                <a class="app-side__item" href="role.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l7 3v5.5c0 4.2-2.9 7.4-7 8.9-4.1-1.5-7-4.7-7-8.9V6l7-3zm0 2.2L7 7.1v4.4c0 3.1 2 5.6 5 6.9 3-1.3 5-3.8 5-6.9V7.1l-5-1.9z"/></svg></span>用户角色管理
                </a>
                <a class="app-side__item is-active" href="role-power.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l8 4v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6l8-4zm0 4.6L8 8.4V12c0 3.2 1.9 5.6 4 6.7 2.1-1.1 4-3.5 4-6.7V8.4l-4-1.8zm-1 3l3.2 2.4L11 14.4v-2.2L9.8 11 11 9.6z"/></svg></span>角色权限配置
                </a>
                <a class="app-side__item" href="page-op-btn.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v3H4V5zm0 5h9v3H4v-3zm0 5h9v3H4v-3zm12-4l4 2.5L16 16v-5z"/></svg></span>页面操作按钮管理
                </a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="角色权限配置">
                <h2 class="page-head__title">角色权限配置</h2>
            </div>

            <!-- 1.1 角色选择 + 检索 -->
            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--role">
                            <label class="el-form-item__label" for="roleSelect">角色</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="roleSelect" title="仅列出启用状态的用户角色">
                                        <option value="">请选择角色</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="keyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input el-input--prefix">
                                    <span class="el-input__prefix">
                                        <svg class="svg-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><g stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></svg>
                                    </span>
                                    <input class="el-input__inner" type="text" id="keyword" name="keyword" placeholder="菜单组 / 菜单项 / 编号 / 页面地址">
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="btnSearch">查询</button>
                            <button type="button" class="el-button" id="btnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 1.2 操作引导区域 -->
            <section class="el-card">
                <div class="el-card__body">
                    <div class="toolbar">
                        <button type="button" class="el-button el-button--primary" id="btnSave">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 3h11l3 3v15H5V3zm3 2v5h8V5H8zm-1 8h10v6H7v-6z"/></svg>保存权限
                        </button>
                        <button type="button" class="el-button" id="btnAll">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>全选
                        </button>
                        <button type="button" class="el-button" id="btnInvert">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v10H7z"/></svg>反选
                        </button>
                        <button type="button" class="el-button el-button--danger" id="btnClear">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 7h12l1 13H7L6 7zm3-4h6l1 2h4v2H4V5h4l1-2z"/></svg>清空
                        </button>
                        <button type="button" class="el-button" id="btnExpand">展开全部</button>
                        <button type="button" class="el-button" id="btnCollapse">折叠全部</button>
                        <button type="button" class="el-button" id="btnRefresh">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>刷新
                        </button>
                        <span class="toolbar-hint">当前角色：<b id="selTip" style="color:#409eff">未选择角色</b>
                            · 菜单 <b id="pwChecked" style="color:#409eff">0</b> / <b id="pwTotal">0</b> 项
                            · 按钮 <b id="pwBtnChecked" style="color:#409eff">0</b> / <b id="pwBtnTotal">0</b> 个
                            · 勾选管理页时，该页面操作按钮默认全选
                            · <b>单击</b>标题展开/收起，<b>双击</b>标题勾选/取消</span>
                    </div>
                </div>
            </section>

            <!-- 1.3 权限树（菜单组 → 菜单项(页面) → 操作按钮，可勾选） -->
            <section class="el-card table-card role-power-card">
                <div class="role-power" id="powerTree"></div>
                <div class="role-power__empty" id="powerEmpty">请先在上方选择角色</div>
            </section>
        </main>
    </div>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
    <script src="js/btnperm.js?v=20261112a"></script>
<script src="js/role-power.js?v=20261101e"></script>
</body>
</html>
