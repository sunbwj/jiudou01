<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>计划与事项 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
<style>
    /* 项目计划：列表 / 甘特 / 日历 / 事项 */
    .pp-views { margin-top: 10px; }
    .pp-gantt { border: 1px solid #ebeef5; border-radius: 4px; overflow: hidden; }
    .pp-gantt__row { display: flex; align-items: center; border-bottom: 1px dashed #f0f2f5; font-size: 12px; }
    .pp-gantt__row:last-child { border-bottom: 0; }
    .pp-gantt__label { flex: 0 0 220px; padding: 6px 8px; color: #303133; white-space: nowrap;
                       overflow: hidden; text-overflow: ellipsis; }
    .pp-gantt__track { position: relative; flex: 1 1 auto; height: 26px; background: #fafbfc; }
    .pp-gantt__bar { position: absolute; top: 5px; height: 16px; border-radius: 3px;
                     background: #409eff; color: #fff; font-size: 10px; line-height: 16px;
                     padding: 0 4px; overflow: hidden; white-space: nowrap; }
    .pp-gantt__bar.is-完成 { background: #67c23a; }
    .pp-gantt__bar.is-异常 { background: #f56c6c; }
    .pp-gantt__bar.is-执行中 { background: #e6a23c; }
    .pp-gantt__axis { display: flex; font-size: 11px; color: #909399; border-bottom: 1px solid #ebeef5; }
    .pp-gantt__axis span { flex: 1 1 auto; padding: 3px 4px; text-align: center; }
    .pp-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .pp-cal__head { font-size: 12px; color: #909399; text-align: center; padding: 4px 0; }
    .pp-cal__day { min-height: 72px; border: 1px solid #ebeef5; border-radius: 4px; padding: 4px;
                   font-size: 11px; color: #606266; }
    .pp-cal__day.is-out { background: #fafafa; color: #c0c4cc; }
    .pp-cal__date { font-weight: 600; margin-bottom: 2px; }
    .pp-cal__item { margin-top: 2px; padding: 1px 4px; border-radius: 3px; background: #ecf5ff;
                    color: #409eff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pp-zones { display: flex; flex-direction: column; gap: 12px; }
    .pp-item-tip { font-size: 12px; color: #909399; }
</style>
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单（被框架页内嵌时由 layout.js 隐藏） ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">项目管理</div>
                <a class="app-side__item" href="project.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7l2 2h9v12H3V5zm2 2v10h14V9h-7.2L9.8 7H5z"/></svg></span>项目信息
                </a>
                <a class="app-side__item is-active" href="project-file.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h8l5 5v15H6V2zm7 1.5V8h4.5L13 3.5zM8 11h8v2H8v-2zm0 4h8v2H8v-2z"/></svg></span>项目文件
                </a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="项目管理/项目计划/计划">
                <h2 class="page-head__title" id="pageTitle">创建计划</h2>
            </div>

            <section class="el-card">
                <div class="el-card__body">
                    <div class="pj-tip" style="margin-bottom:10px">
                        <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <span><b>计划基础信息</b>：所属项目、计划编号（PL + 6 位，自动生成）、计划起止时间段、说明。</span>
                    </div>
                    <form class="el-form el-form--inline" id="planForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item">
                            <label class="el-form-item__label" for="pfProject">所属项目</label>
                            <div class="el-form-item__content"><div class="el-input search-input--select">
                                <select class="el-input__inner" id="pfProject"></select></div></div>
                        </div>
                        <div class="el-form-item">
                            <label class="el-form-item__label" for="pfCode">计划编号</label>
                            <div class="el-form-item__content"><div class="el-input">
                                <input class="el-input__inner" type="text" id="pfCode" readonly placeholder="保存后自动生成 PL + 6 位"></div></div>
                        </div>
                        <div class="el-form-item">
                            <label class="el-form-item__label" for="pfName">计划名称</label>
                            <div class="el-form-item__content"><div class="el-input">
                                <input class="el-input__inner" type="text" id="pfName" maxlength="150" placeholder="如：一阶段实施计划"></div></div>
                        </div>
                        <div class="el-form-item">
                            <label class="el-form-item__label" for="pfStart">计划起止</label>
                            <div class="el-form-item__content"><div class="el-input el-input--inline2">
                                <input class="el-input__inner" type="date" id="pfStart"><span class="pj-dash">至</span>
                                <input class="el-input__inner" type="date" id="pfEnd"></div></div>
                        </div>
                        <div class="el-form-item" style="flex:1 1 100%">
                            <label class="el-form-item__label" for="pfDesc">说明</label>
                            <div class="el-form-item__content"><div class="el-input">
                                <textarea class="el-input__inner" id="pfDesc" rows="3" maxlength="2000" placeholder="计划目标 / 范围 / 约束等"></textarea></div></div>
                        </div>
                    </form>
                    <div style="margin-top:8px">
                        <button type="button" class="el-button el-button--primary" id="btnSavePlan">保存计划</button>
                        <button type="button" class="el-button" id="btnBack">返回列表</button>
                    </div>
                </div>
            </section>

            <section class="el-card">
                <div class="el-card__body">
                    <div class="toolbar toolbar--icons" role="toolbar" aria-label="计划事项操作">
                        <button type="button" class="el-button el-button--success el-button--icon" id="btnItemAdd" disabled title="新增事项 / 任务" aria-label="新增事项">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--primary el-button--icon" id="btnItemEdit" disabled title="编辑事项" aria-label="编辑事项">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 19h2.4l9.3-9.3-2.4-2.4L5 16.6V19zM3 21v-4.2L15.9 3.9l4.2 4.2L7.2 21H3z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--danger el-button--icon" id="btnItemDelete" disabled title="删除事项" aria-label="删除事项">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h10l1 2h3v2H3V6h3l1-2zm-1 6h12l-1 11H7L6 10z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="btnItemDetail" disabled title="事项详情（含附件）" aria-label="事项详情">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5C21.3 7.6 17 4.5 12 4.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--warning el-button--icon" id="btnStartPlan" disabled title="启动计划（补派工单并通知）" aria-label="启动计划">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="btnItemRefresh" disabled title="刷新事项" aria-label="刷新事项">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
                        </button>
                        <span class="toolbar-hint">共 <b id="itemCount">0</b> 条事项</span>
                    </div>
                </div>
            </section>

            <section class="el-card table-card">
                <div class="table-wrapper" id="itemWrapper">
                    <div class="el-table">
                        <div class="el-table__inner-wrapper">
                            <table id="itemTable">
                                <colgroup>
                                    <col style="width:60px"><col style="width:48px"><col style="width:100px">
                                    <col><col style="width:76px"><col style="width:150px">
                                    <col style="width:90px"><col style="width:130px"><col style="width:80px">
                                    <col style="width:90px"><col style="width:70px">
                                </colgroup>
                                <thead><tr>
                                    <th class="is-center">序号</th><th class="is-center">选择</th><th>事项编号</th>
                                    <th>事项 / 任务</th><th class="is-center">类型</th><th>前置事项</th>
                                    <th>责任人</th><th class="is-center">开始时间</th><th class="is-center">状态</th>
                                    <th class="is-center">工单</th><th class="is-center">附件</th>
                                </tr></thead>
                                <tbody id="itemTbody" class="el-table__body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
<script src="js/btnperm.js?v=20261112a"></script>
<script src="js/file-preview.js?v=20261110e"></script>
<script src="js/project-plan-form.js?v=20261110d"></script>
</body>
</html>
