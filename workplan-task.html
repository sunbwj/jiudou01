<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>我的任务 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/workplan.css?v=20261112e">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
</head>
<body>

<div class="app">
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user"><span class="avatar">管</span><span class="name">系统管理员</span></div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">项目管理</div>
                <a class="app-side__item" href="project.html">项目信息</a>
                <a class="app-side__item" href="workplan.html">计划管理</a>
                <a class="app-side__item is-active" href="workplan-task.html">我的任务</a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="项目管理/我的任务">
                <h2 class="page-head__title">我的任务</h2>
            </div>

            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="wtProject">关联项目</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="wtProject"><option value="">全部项目</option></select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="wtKeyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input"><input class="el-input__inner" type="text" id="wtKeyword" placeholder="工单号 / 任务 / 计划名称"></div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label">我的角色</label>
                            <div class="el-form-item__content">
<div class="wt-multi" id="wtRoleMulti" data-placeholder="全部角色"><input type="hidden" id="wtRole"><button type="button" class="wt-multi__box" aria-haspopup="true"><span class="wt-multi__text">全部角色</span><span class="wt-multi__caret">▾</span></button><div class="wt-multi__drop" hidden><label class="wt-multi__opt"><input type="checkbox" value="责任人"> 责任人</label><label class="wt-multi__opt"><input type="checkbox" value="参与人员"> 参与人员</label><div class="wt-multi__foot"><button type="button" class="wt-multi__clear">清空</button></div></div></div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label">完成状态</label>
                            <div class="el-form-item__content">
<div class="wt-multi" id="wtExecMulti" data-placeholder="全部状态"><input type="hidden" id="wtExec"><button type="button" class="wt-multi__box" aria-haspopup="true"><span class="wt-multi__text">全部状态</span><span class="wt-multi__caret">▾</span></button><div class="wt-multi__drop" hidden><label class="wt-multi__opt"><input type="checkbox" value="未开始"> 未开始</label><label class="wt-multi__opt"><input type="checkbox" value="进行中"> 进行中</label><label class="wt-multi__opt"><input type="checkbox" value="已完成"> 已完成</label><label class="wt-multi__opt"><input type="checkbox" value="已延期"> 已延期</label><label class="wt-multi__opt"><input type="checkbox" value="已取消"> 已取消</label><div class="wt-multi__foot"><button type="button" class="wt-multi__clear">清空</button></div></div></div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label">工单状态</label>
                            <div class="el-form-item__content">
<div class="wt-multi" id="wtStatusMulti" data-placeholder="全部状态"><input type="hidden" id="wtStatus"><button type="button" class="wt-multi__box" aria-haspopup="true"><span class="wt-multi__text">全部状态</span><span class="wt-multi__caret">▾</span></button><div class="wt-multi__drop" hidden><label class="wt-multi__opt"><input type="checkbox" value="待处理"> 待处理</label><label class="wt-multi__opt"><input type="checkbox" value="处理中"> 处理中</label><label class="wt-multi__opt"><input type="checkbox" value="已完成"> 已完成</label><div class="wt-multi__foot"><button type="button" class="wt-multi__clear">清空</button></div></div></div>
                            </div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="wtBtnSearch">查询</button>
                            <button type="button" class="el-button" id="wtBtnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="el-card">
                <div class="el-card__body">
                    <!-- 标准 .toolbar：纳入 pageopbtn 扫描 + btnperm.js 按角色授权加载；
                         .wp-toolbar / --icons 保留图标栏视觉 -->
                    <div class="toolbar toolbar--icons wp-toolbar wp-toolbar--icons" role="toolbar" aria-label="我的任务操作">
                        <button type="button" class="el-button el-button--icon" id="wtBtnRefresh"
                                title="刷新" aria-label="刷新">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--primary el-button--icon" id="wtBtnOpenTask" disabled
                                title="打开任务（跳到工作计划并定位该任务）" aria-label="打开任务">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--primary el-button--icon" id="wtBtnExec" disabled
                                title="执行记录（回填完成状态 / 实际起止 / 说明）" aria-label="执行记录">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h8l5 5v15H6V2zm7 1.5V8h4.5L13 3.5zM8 11h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
                        </button>
                        <button type="button" class="el-button el-button--icon" id="wtBtnGoPlan"
                                title="去计划管理（返回计划列表）" aria-label="去计划管理">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h16v2H4v-2z"/></svg>
                        </button>
                        <span class="wp-hint"><b id="wtPick">未选中行</b> · 共 <b id="wtCount">0</b> 条与我相关的工单</span>
                    </div>
                </div>
            </section>

            <section class="el-card table-card wp-list">
                <div class="table-wrapper" id="wtTableWrapper">
                    <div class="el-table">
                        <div class="el-table__inner-wrapper">
                            <table id="wtTable">
                                <colgroup>
                                    <col style="width:105px"><col><col style="width:150px">
                                    <col style="width:85px"><col style="width:85px"><col style="width:165px">
                                    <col style="width:85px"><col style="width:165px"><col style="width:85px">
                                    <col style="width:95px"><col style="width:100px"><col style="width:135px">
                                </colgroup>
                                <thead><tr>
                                    <th class="is-center" style="width:60px">序号</th>
                                    <th>工单编号</th><th>任务名称</th><th>所属计划</th>
                                    <th class="is-center">我的角色</th><th class="is-center">责任人</th>
                                    <th class="is-center">计划起止</th><th class="is-center">完成状态</th>
                                    <th class="is-center">实际起止</th><th class="is-center">工单状态</th>
                                    <th class="is-center">关联任务</th><th class="is-center">执行记录</th>
                <th class="is-center">变更历史</th>
                <th class="is-center">通知</th>
                                    <th class="is-center">派送时间</th>
                                </tr></thead>
                                <tbody id="wtTbody" class="el-table__body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="pager-wrap" id="wtPager"></div>
            </section>
        </main>
    </div>
</div>

<!-- ============ 执行记录：回填到关联任务（双向关联） ============ -->
<script type="text/template" id="wtExecTpl">
<div class="wp-form" id="wtExecForm">
    <label>工单 / 任务</label>
    <input class="el-input__inner wp-span2" type="text" id="wtExTitle" readonly>
    <label for="wtExExec">完成状态</label>
    <select class="el-input__inner" id="wtExExec">
        <option value="未开始">未开始</option><option value="进行中">进行中</option>
        <option value="已完成">已完成</option><option value="已延期">已延期</option>
        <option value="已取消">已取消</option>
    </select>
    <label for="wtExStatus">工单状态</label>
    <select class="el-input__inner" id="wtExStatus">
        <option value="待处理">待处理</option><option value="处理中">处理中</option>
        <option value="已完成">已完成</option>
    </select>
    <label for="wtExActualStart">实际开始</label>
    <input class="el-input__inner" type="date" id="wtExActualStart">
    <label for="wtExActualEnd">实际结束</label>
    <input class="el-input__inner" type="date" id="wtExActualEnd">
    <label for="wtExProgress">完成百分比</label>
    <div style="display:flex;align-items:center;gap:8px">
        <input type="range" id="wtExProgress" min="0" max="100" step="5" style="flex:1">
        <span id="wtExProgressText" style="width:36px">0%</span>
    </div>
    <span class="wp-fill" aria-hidden="true"></span>
    <label for="wtExRemark">执行说明</label>
    <textarea class="el-input__inner wp-span2 wp-exec-remark" id="wtExRemark" rows="4"
              maxlength="1000" placeholder="执行过程 / 完成情况 / 偏差说明"></textarea>
    <label for="wtExFiles">附件（可多选）</label>
    <div class="wp-span2">
        <input type="file" id="wtExFiles" multiple>
        <div class="wp-hintline" id="wtExFilesTip">单个附件不超过 10 MB，一次最多 10 个；图片可直接在线预览。</div>
        <div id="wtExFilesList" class="wp-exec-files"></div>
    </div>
    <label>历史记录</label>
    <div class="wp-span2" id="wtExHistory"><div class="wp-hintline">加载中…</div></div>
    <div class="wp-hintline" id="wtExLinkHint">每次提交都会留档（未标记完成前可多次提交）；保存后同步回工作计划中的任务，甘特图 / 日历图 / 网格列表会一并更新。</div>
</div>
</script>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
<script src="js/btnperm.js?v=20261112a"></script>
<script src="js/word-import.js?v=20261106c"></script>
<!-- 附件在线预览：与项目文件管理同一套 js/file-preview.js -->
<script src="js/file-preview.js?v=20261110e"></script>
<script src="js/workplan-task.js?v=20261110k"></script>
</body>
</html>
