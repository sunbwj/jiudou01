<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="renderer" content="webkit">
<meta name="format-detection" content="telephone=no">
<title>字典键值 - 九豆综合管理平台</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/element-ui.css?v=20261110d">
<link rel="stylesheet" href="css/app.css?v=20261110f">
<link rel="stylesheet" href="css/theme.css?v=20261031c">
<!--[if lt IE 9]>
<script src="https://cdn.jsdelivr.net/npm/html5shiv@3.7.3/dist/html5shiv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/respond.js@1.4.2/dest/respond.min.js"></script>
<![endif]-->
</head>
<body>

<div class="app">
    <!-- ============ 顶部导航 ============ -->
    <header class="app-header">
        <button type="button" class="app-header__toggle" id="sideToggle" aria-label="菜单">☰</button>
        <div class="app-header__logo">
            <img class="logo-mark" src="assets/logo.svg" alt="九豆">
            <span>九豆综合管理平台</span>
        </div>
        <div class="app-header__spacer"></div>
        <div class="app-header__user">
            <span class="avatar">管</span>
            <span class="name">系统管理员</span>
        </div>
        <div class="theme-switch" id="pageTheme"></div>
    </header>

    <div class="app-body">
        <!-- ============ 左侧菜单（被框架页内嵌时由 layout.js 隐藏） ============ -->
        <aside class="app-side" id="appSide">
            <nav class="app-side__menu">
                <div class="app-side__group-title">系统配置</div>
                <a class="app-side__item" href="sysdict.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></span>系统字典
                </a>
                <a class="app-side__item is-active" href="sysdict-item.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h8l5 5v15H6V2zm7 1.5V8h4.5L13 3.5zM8 11h8v2H8v-2zm0 4h8v2H8v-2z"/></svg></span>字典键值
                </a>
                <a class="app-side__item" href="syspara.html">
                    <span class="ico"><svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.8 7.8 0 000-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 00-1.7-1L15 3h-4l-.4 2.9a7.7 7.7 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.8 7.8 0 000 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 001.7 1L11 21h4l.4-2.9a7.7 7.7 0 001.7-1l2.5 1 2-3.5-2.2-1.6zM13 16a4 4 0 110-8 4 4 0 010 8z"/></svg></span>系统参数
                </a>
            </nav>
        </aside>
        <div class="app-side__mask" id="sideMask"></div>

        <!-- ============ 主内容 ============ -->
        <main class="app-main">
            <div class="page-head" id="pageHead" data-crumb="系统配置/字典键值">
                <h2 class="page-head__title">字典键值</h2>
            </div>

            <!-- 说明 -->
            <section class="el-card pj-tipcard">
                <div class="el-card__body">
                    <div class="pj-tip">
                        <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <span>
                            <b>本页已并入「系统字典」页</b>：日常维护请在系统字典页<b>左侧双击一条字典</b>，
                            右区即显示它的键值列表；本页保留为独立入口（可按字典批量查看）。
                            同一字典下<b>键不可重复</b>，键留空可存纯枚举列表，显示序号决定下拉项顺序。
                            当前所属字典：<b id="siCurrentDict">全部字典</b>。
                        </span>
                    </div>
                </div>
            </section>

            <!-- 检索区域 -->
            <section class="el-card search-card">
                <div class="el-card__body">
                    <form class="el-form el-form--inline search-form" id="searchForm" autocomplete="off" onsubmit="return false;">
                        <div class="el-form-item search-item--status">
                            <label class="el-form-item__label" for="dictId">所属字典</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="dictId" name="dictId">
                                        <option value="">全部字典</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--kw">
                            <label class="el-form-item__label" for="keyword">关键字</label>
                            <div class="el-form-item__content">
                                <div class="el-input el-input--prefix">
                                    <span class="el-input__prefix">
                                        <svg class="svg-ico" viewBox="0 0 24 24" style="width:16px;height:16px"><g stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></svg>
                                    </span>
                                    <input class="el-input__inner" type="text" id="keyword" name="keyword" placeholder="键 / 键值 / 说明">
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-item--status">
                            <label class="el-form-item__label" for="enabled">启用状态</label>
                            <div class="el-form-item__content">
                                <div class="el-input search-input--select">
                                    <select class="el-input__inner" id="enabled" name="enabled">
                                        <option value="">全部</option>
                                        <option value="1">启用</option>
                                        <option value="0">停用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="el-form-item search-btns">
                            <button type="button" class="el-button el-button--primary" id="btnSearch">查询</button>
                            <button type="button" class="el-button" id="btnReset">重置</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 操作引导区域 -->
            <section class="el-card">
                <div class="el-card__body">
                    <div class="toolbar">
                        <button type="button" class="el-button el-button--success" id="btnAdd">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>新增键值
                        </button>
                        <button type="button" class="el-button el-button--primary" id="btnEdit" disabled>
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 19h2.4l9.3-9.3-2.4-2.4L5 16.6V19zM3 21v-4.2L15.9 3.9l4.2 4.2L7.2 21H3z"/></svg>编辑
                        </button>
                        <button type="button" class="el-button el-button--success" id="btnEnable" disabled>
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 14.4l-4-4 1.4-1.4L11 13.6l4.6-4.6L17 10.4l-6 6z"/></svg>启用
                        </button>
                        <button type="button" class="el-button el-button--warning" id="btnDisable" disabled>
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm5 11H7v-2h10v2z"/></svg>停用
                        </button>
                        <button type="button" class="el-button el-button--danger" id="btnDelete" disabled>
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h10l1 2h3v2H3V6h3l1-2zm-1 6h12l-1 11H7L6 10z"/></svg>删除
                        </button>
                        <button type="button" class="el-button" id="btnBack">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>返回字典
                        </button>
                        <button type="button" class="el-button" id="btnRefresh">
                            <svg class="svg-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>刷新
                        </button>
                        <span class="toolbar-hint">共 <b id="siCount">0</b> 条键值</span>
                    </div>
                </div>
            </section>

            <!-- 查询结果 -->
            <section class="el-card table-card">
                <div class="table-wrapper" id="tableWrapper">
                    <div class="el-table">
                        <div class="el-table__inner-wrapper">
                            <table id="siTable">
                                <colgroup>
                                    <col style="width:60px">
                                    <col style="width:48px">
                                    <col style="width:200px">
                                    <col style="width:130px">
                                    <col style="width:160px">
                                    <col style="width:90px">
                                    <col>
                                    <col style="width:80px">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th class="is-center">序号</th>
                                    <th class="is-center">选择</th>
                                    <th>所属字典</th>
                                    <th>键</th>
                                    <th>键值</th>
                                    <th class="is-center">显示序号</th>
                                    <th>说明</th>
                                    <th class="is-center">启用</th>
                                </tr>
                                </thead>
                                <tbody id="siTbody" class="el-table__body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="pager-wrap" id="pagerWrap"></div>
            </section>
        </main>
    </div>
</div>

<!-- ============ 新增 / 编辑键值弹窗模板 ============ -->
<div id="itemFormTpl" style="display:none;">
    <form class="el-form pj-form syscfg-form" id="itemForm" autocomplete="off" onsubmit="return false;">
        <div class="el-form-item is-required" data-field="dictId">
            <label class="el-form-item__label" for="siDict">所属字典</label>
            <div class="el-form-item__content">
                <div class="el-input"><select class="el-input__inner" id="siDict">
                    <option value="">请选择所属字典</option>
                </select></div>
            </div>
        </div>
        <div class="el-form-item" data-field="itemKey">
            <label class="el-form-item__label" for="siKey">键</label>
            <div class="el-form-item__content">
                <div class="el-input"><input class="el-input__inner sys-name-en" type="text" id="siKey" maxlength="150" placeholder="选填，如：M / doing"></div>
                <div class="form-tip">程序用的编码；同一字典下不可重复，留空表示纯枚举值</div>
            </div>
        </div>
        <div class="el-form-item is-required" data-field="itemValue">
            <label class="el-form-item__label" for="siValue">键值</label>
            <div class="el-form-item__content">
                <div class="el-input"><input class="el-input__inner" type="text" id="siValue" maxlength="300" placeholder="如：男 / 进行中"></div>
            </div>
        </div>
        <div class="el-form-item" data-field="sortNo">
            <label class="el-form-item__label" for="siSort">显示序号</label>
            <div class="el-form-item__content">
                <div class="el-input"><input class="el-input__inner" type="number" id="siSort" value="0" step="1"></div>
            </div>
        </div>
        <div class="el-form-item" data-field="remark">
            <label class="el-form-item__label" for="siRemark">说明</label>
            <div class="el-form-item__content">
                <div class="el-input"><textarea class="el-input__inner pj-textarea" id="siRemark" maxlength="500" rows="3" placeholder="选填，最多 500 字"></textarea></div>
            </div>
        </div>
        <div class="el-form-item" data-field="enabled">
            <label class="el-form-item__label" for="siEnabled">启用状态</label>
            <div class="el-form-item__content">
                <div class="el-input">
                    <select class="el-input__inner" id="siEnabled">
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="vendor/jquery-3.7.1.min.js"></script>
<script src="js/theme.js?v=20261031c"></script>
<script src="js/icons.js"></script>
<script src="js/api.js?v=20261119d"></script>
<script src="js/ui.js?v=20261105a"></script>
<script src="js/layout.js?v=20261031b"></script>
    <script src="js/btnperm.js?v=20261112a"></script>
<script src="js/sysdict-item.js?v=20261106a"></script>
</body>
</html>
